name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CreditTracker.sln

      - name: Build solution
        run: dotnet build CreditTracker.sln --configuration Release --no-restore

      - name: Run tests
        run: >-
          dotnet test CreditTracker.sln --configuration Release --no-build --no-restore
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings

      - name: Generate coverage summary
        if: always() && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.6.0 --tool-path "$RUNNER_TEMP/reportgenerator"
          "$RUNNER_TEMP/reportgenerator/reportgenerator" \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:TestResults/coverage" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            TestResults/**/coverage.cobertura.xml
            TestResults/coverage/
          if-no-files-found: ignore
          retention-days: 7
